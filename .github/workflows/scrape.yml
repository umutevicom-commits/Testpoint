name: Drive linklerini Internet Archive'a önbelleğe al

on:
  schedule:
    # Her 30 dakikada bir çalışır. GitHub'da cron UTC'dir.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
    # Yukarıdaki satır, GitHub Actions sekmesinden "Run workflow" ile
    # istediğiniz an elle de tetikleyebilmenizi sağlar.

# BATCH_LIMIT 50'ye çıkarıldığından bir koşu artık 30 dakikadan uzun sürebilir
# (özellikle büyük ROM dosyalarında). Bu kilit, önceki koşu bitmeden 30 dk'lık
# zamanlayıcının yeni bir koşu başlatıp aynı satırları ikinci kez işlemeye
# çalışmasını (ve gereksiz Drive/IA trafiğini) önler.
concurrency:
  group: cache-to-ia
  cancel-in-progress: false

# En az ayrıcalık ilkesi: bu job hiçbir yere git push yapmıyor, sadece
# Supabase ve Internet Archive ile konuşuyor — GITHUB_TOKEN'a varsayılan
# (bazen yazma dahil) izinler yerine sadece okuma izni veriyoruz.
permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    # BATCH_LIMIT=50 ile bazı dosyalar büyük ROM'lar (10+ GB) olabileceğinden
    # 25 dk yetersiz kalabilirdi; 25 dk'lık job'un ortasında kesilip yarım
    # kalan bir indirmenin/yüklemenin cache_status'u kirletmemesi için süreyi
    # genişlettik.
    timeout-minutes: 180
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # NOT: npm cache (cache: "npm") kasten kaldırıldı — repoda
          # scripts/migrate-to-ia/package-lock.json bulunmadığı için
          # setup-node "Some specified paths were not resolved, unable
          # to cache dependencies" hatasıyla job'ı daha ilk adımda
          # durduruyordu. Lockfile'ı oluşturup commit'lerseniz cache'i
          # (ve npm ci'yi) güvenle geri ekleyebiliriz.

      - name: Bağımlılıkları kur
        working-directory: scripts/migrate-to-ia
        # npm ci yerine npm install: package-lock.json'a bağımlı değil,
        # lockfile olsun ya da olmasın çalışır.
        run: npm install

      - name: Yeni dosyaları IA'ya taşı
        working-directory: scripts/migrate-to-ia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # Geçmiş yığını (3500+ dosya) daha hızlı eritmek için 5'ten 50'ye
          # çıkarıldı. timeout-minutes 180'e çıkarıldı ve concurrency kilidi
          # eklendi ki büyük dosyalarla bir koşu 30 dk'yı geçerse zamanlayıcı
          # üstüne yeni bir koşu başlatmasın.
          BATCH_LIMIT: "50"
          DELAY_MS: "3000"
        run: node migrate-to-ia.mjs
