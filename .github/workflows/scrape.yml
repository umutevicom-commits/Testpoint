name: Scrape Testpoints/Pinouts & Update Feed

on:
  schedule:
    # Once a day. Every run re-scrapes the ENTIRE archive (all brands, all
    # platforms, all images) from scratch — there is no incremental/batch
    # limiting. Given the volume (thousands of images across ~160+ brands)
    # and GitHub Actions' 6-hour-per-job hard limit, "every 6 hours" is not
    # realistic for a full-archive+images run — daily is the safe default.
    # Lower this further (e.g. weekly, "0 3 * * 0") if a full run regularly
    # takes several hours, to stay within your Actions minutes budget.
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Full-archive run: every brand, every platform tab, every image,
    # downloaded fresh each time. This is NOT incremental/batched like
    # the old ROM scraper was — with thousands of testpoint images this
    # can take a while, so the timeout is generous.
    timeout-minutes: 340

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Puppeteer + Chromium)
        run: npm install

      - name: Run testpoints/pinouts scraper (full archive, with images)
        run: |
          echo "Scraping FULL archive: sigmakey.com Testpoints/Pinouts (every brand, every image)"
          node fetch_testpoints.js --out-dir ./feed --download-images

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update testpoints/pinouts feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # --autostash: if the working tree has any other uncommitted/
            # unstaged changes at this point (e.g. left over from npm
            # install, line-ending normalization on checkout, etc.), stash
            # them before rebasing and re-apply them after, instead of
            # failing with "cannot pull with rebase: you have unstaged
            # changes".
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
