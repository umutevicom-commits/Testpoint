name: Scrape Testpoints/Pinouts & Update Feed

on:
  schedule:
    # Runs every 6 hours. Adjust as needed — this scraper is heavier
    # (real headless browser) than the old RSS scraper was.
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Puppeteer + Chromium)
        run: npm install

      - name: Run testpoints/pinouts scraper
        run: |
          echo "Scraping: sigmakey.com Testpoints/Pinouts (topic name + image URL)"
          node fetch_testpoints.js --out-dir ./feed

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update testpoints/pinouts feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
